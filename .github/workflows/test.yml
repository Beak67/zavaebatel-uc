name: Test

on:
  pull_request:
  push:
    branches: [main, "security/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zavaebatel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zavaebatel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zavaebatel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --check server.js && node --check public/admin.js && node --check public/storefront.js
      - run: npm test
      - run: npm audit --omit=dev
