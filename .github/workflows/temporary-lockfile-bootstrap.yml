name: Temporary lockfile bootstrap

on:
  push:
    branches: [security/audit-safe-storefront]

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.ref == 'refs/heads/security/audit-safe-storefront'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate or update authentic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile changes to this branch only
        run: |
          if test ! -f package-lock.json; then
            echo "npm did not generate package-lock.json" >&2
            exit 1
          fi
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: refresh npm-generated package lock"
            git push origin HEAD:security/audit-safe-storefront
          fi
      - name: Verify clean install
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev
