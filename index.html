
<script>
const tg = window.Telegram?.WebApp;

try {
  tg?.ready();
  tg?.expand();
} catch {}

const productsEl = document.getElementById('products');
const notice = document.getElementById('notice');

function render(products) {
  productsEl.replaceChildren();

  if (!products.length) {
    productsEl.innerHTML =
      '<div class="empty">Пакеты UC не найдены. Проверь каталог Nexus.</div>';
    return;
  }

  const fragment = document.createDocumentFragment();

  for (const p of products) {
    const id = String(p.id || '');
    const name = String(p.name || p.title || 'Пакет UC');

    // Например, pubg-mobile:uc:660 -> 660 UC.
    const match = id.match(/pubg-mobile:uc:(\d+)/i);
    const amount = match ? Number(match[1]) : null;

    const price = Number(p.price);
    const validPrice = p.price !== null &&
      p.price !== undefined &&
      p.price !== '' &&
      Number.isFinite(price);

    const card = document.createElement('article');
    card.className = 'product';

    const coin = document.createElement('div');
    coin.className = 'coin';

    if (p.icon) {
      const img = document.createElement('img');
      img.src = p.icon;
      img.alt = '';
      img.width = 52;
      img.height = 52;
      img.style.objectFit = 'contain';
      img.onerror = () => {
        img.replaceWith(makeCoinLabel());
      };
      coin.appendChild(img);
    } else {
      coin.appendChild(makeCoinLabel());
    }

    function makeCoinLabel() {
      const span = document.createElement('span');
      span.textContent = 'UC';
      return span;
    }

    const qty = document.createElement('div');
    qty.className = 'qty';
    qty.textContent = amount !== null
      ? `${amount.toLocaleString('en-US')} UC`
      : name;

    const desc = document.createElement('div');
    desc.className = 'desc';
    desc.textContent = 'PUBG MOBILE';

    const priceEl = document.createElement('div');
    priceEl.className = 'price';

    // Цена поставщика пока показывается в USD.
    // Уточни валюту в кабинете Nexus перед запуском продаж.
    priceEl.textContent = validPrice
      ? `$${price.toFixed(2)}`
      : 'Цена уточняется';

    const button = document.createElement('button');
    button.className = 'buy';
    button.textContent = 'Скоро';
    button.disabled = true;
    button.title = 'Покупка пока не подключена';

    card.append(coin, qty, desc, priceEl, button);
    fragment.appendChild(card);
  }

  productsEl.appendChild(fragment);
}

async function loadCatalog() {
  productsEl.innerHTML =
    '<div class="empty loading">Загружаем пакеты UC…</div>';

  try {
    const response = await fetch('/api/catalog', {
      headers: { Accept: 'application/json' }
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || `HTTP ${response.status}`);
    }

    // Сервер возвращает именно data.products.
    const products = Array.isArray(data.products)
      ? data.products
      : [];

    notice.textContent = products.length
      ? `Каталог загружен: ${products.length} пакетов UC. Покупка пока отключена.`
      : 'Nexus подключён, но пакеты UC не найдены.';

    render(products);
  } catch (error) {
    console.error('Catalog error:', error);

    notice.textContent =
      'Не удалось загрузить каталог. Покупка отключена до проверки настроек.';

    productsEl.innerHTML =
      '<div class="empty">Каталог временно недоступен. Попробуй обновить страницу позже.</div>';
  }
}

loadCatalog();
</script>
