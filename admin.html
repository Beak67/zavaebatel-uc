<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZAVAEBATEL UC — админ</title><style>body{margin:0;background:#0a101c;color:#edf2fb;font:15px system-ui;padding:20px}main{max-width:1000px;margin:auto}input,button,textarea{padding:10px;border-radius:8px;border:1px solid #34425a;background:#111a2a;color:inherit}button{cursor:pointer}section{margin:16px 0;padding:16px;background:#111a2a;border-radius:12px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #34425a}small{color:#a7b4c8}.hidden{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><main><h1>ZAVAEBATEL UC · Администрирование</h1><p><small>Оплату подтверждайте только после проверки фактического поступления денег в банковском приложении. Скриншот сам по себе не является подтверждением.</small></p><section id="login"><h2>Вход администратора</h2><p id="notice">Введите пароль из ADMIN_PASSWORD. Если переменные или PostgreSQL не настроены, вход отключён.</p><form id="loginForm"><input id="password" type="password" autocomplete="current-password" required placeholder="Пароль администратора"><button>Войти</button></form></section><section id="orders" class="hidden"><button id="refresh">Обновить заказы</button> <button id="logout">Выйти</button><div id="list"></div></section></main><script>
let csrf='';const notice=document.querySelector('#notice');async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{...(opts.body?{'Content-Type':'application/json'}:{}),...(csrf?{'X-CSRF-Token':csrf}:{}),...(opts.headers||{})},cache:'no-store'});const d=await r.json().catch(()=>({error:'Ошибка ответа сервера'}));if(!r.ok)throw Error(d.error||'Ошибка запроса');return d}
document.querySelector('#loginForm').addEventListener('submit',async e=>{e.preventDefault();try{const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:document.querySelector('#password').value})});csrf=d.csrfToken;document.querySelector('#login').classList.add('hidden');document.querySelector('#orders').classList.remove('hidden');await refresh()}catch(e){notice.textContent=e.message}});
async function refresh(){try{const s=await api('/api/admin/session');csrf=s.csrfToken;const d=await api('/api/admin/orders');const list=document.querySelector('#list');list.replaceChildren();if(!d.orders.length){list.textContent='Заказов пока нет.';return}const table=document.createElement('table');table.innerHTML='<thead><tr><th>Заказ</th><th>Товар / Player ID</th><th>Сумма</th><th>Статус</th><th>Действия</th></tr></thead>';const body=document.createElement('tbody');for(const o of d.orders){const tr=document.createElement('tr');const values=[o.public_id,o.product_name+' / '+o.player_id,Number(o.amount_rub).toLocaleString('ru-RU')+' ₽',o.status];for(const v of values){const td=document.createElement('td');td.textContent=v;tr.append(td)}const td=document.createElement('td');const actions=document.createElement('div');actions.className='actions';if(o.receipt_uploaded_at){const a=document.createElement('a');a.href='/api/admin/orders/'+encodeURIComponent(o.public_id)+'/receipt';a.textContent='Чек';a.target='_blank';a.rel='noopener';actions.append(a)}for(const [act,label] of [['confirm','Подтвердить оплату'],['reject','Отклонить'],['fulfill','Отметить выданным']]){if((act==='confirm'&&o.status!=='receipt_submitted')||(act==='reject'&&o.status!=='receipt_submitted')||(act==='fulfill'&&o.status!=='paid'))continue;const b=document.createElement('button');b.textContent=label;b.addEventListener('click',async()=>{if(act==='confirm'&&!confirm('Подтверждайте только после проверки поступления денег в банковском приложении. Продолжить?'))return;try{await api('/api/admin/orders/'+encodeURIComponent(o.public_id)+'/'+act,{method:'POST',body:JSON.stringify({})});await refresh()}catch(e){alert(e.message)}});actions.append(b)}td.append(actions);tr.append(td);body.append(tr)}table.append(body);list.append(table)}catch(e){notice.textContent=e.message}}
document.querySelector('#refresh').onclick=refresh;document.querySelector('#logout').onclick=async()=>{try{await api('/api/admin/logout',{method:'POST',body:'{}'})}catch{}location.reload()};
</script></body></html>
